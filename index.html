<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Briefing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { color: #94a3b8; font-size: 1rem; font-weight: 400; margin-bottom: 10px; }
        .voice-badge { 
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        .controls { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6); }
        .btn-primary:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        
        .btn-stop {
            flex: 0.4;
            background: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
            display: none;
        }
        .btn-stop:hover { background: #dc2626; transform: translateY(-2px); }

        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }
        #transcript {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #cbd5e1;
            display: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }
        .highlight {
            background: rgba(139, 92, 246, 0.25);
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Briefing</h1>
            <p class="subtitle">Curated global news, delivered like a radio broadcast.</p>
            <span class="voice-badge">🎙️ Cloud Voice: Google Neural (UK)</span>
        </div>
        
        <div class="controls">
            <button id="generateBtn" class="btn btn-primary" onclick="startBriefing()">Generate & Play</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopBriefing()">Stop</button>
        </div>
        
        <div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="status"></p>
        <div id="error-box" class="error-box"></div>
        
        <div id="transcript"></div>
    </div>

    <script>
        let audioElements = [];
        let currentChunkIndex = 0;
        let isPlaying = false;

        function cleanText(text) {
            if (!text) return "";
            return text
                .replace(/\[.*?\]\(.*?\)/g, '')
                .replace(/https?:\/\/\S+/g, '')
                .replace(/Published Time:.*?Z/gi, '')
                .replace(/Skip to content/gi, '')
                .replace(/<[^>]*>/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Smart chunking to respect Google TTS character limits
        function chunkText(text, maxLength = 180) {
            const chunks = [];
            let current = "";
            const words = text.split(" ");
            for (let word of words) {
                if ((current + " " + word).length > maxLength) {
                    if (current) chunks.push(current.trim());
                    current = word;
                } else {
                    current += (current ? " " : "") + word;
                }
            }
            if (current) chunks.push(current.trim());
            return chunks;
        }

        async function fetchBriefingData() {
            updateStatus("Fetching top global stories...");
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-fill').style.width = '50%';
            document.getElementById('error-box').style.display = 'none';

            const RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
            
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Failed to fetch news feed");
            
            const data = await response.json();
            if (data.status !== 'ok') throw new Error("News service returned an error");
            
            const items = data.items.slice(0, 5); // 5 stories for a rich briefing
            const stories = [];

            for (let item of items) {
                const title = item.title || "Untitled";
                let rawContext = item.content || item.description || "";
                let context = cleanText(rawContext);
                
                if (context.length > 150) context = context.substring(0, 150).trim() + "...";
                else if (context.length < 30) context = "Details are still emerging on this story.";
                
                stories.push({ title, context });
            }
            
            document.getElementById('progress-fill').style.width = '100%';
            setTimeout(() => { document.getElementById('progress-bar').style.display = 'none'; }, 500);
            return stories;
        }

        function buildRadioScript(stories) {
            const today = new Intl.DateTimeFormat('en-GB', { 
                weekday: 'long', day: 'numeric', month: 'long' 
            }).format(new Date());

            let script = `Welcome to your global briefing for ${today}. Here are the top stories shaping our world right now.\n\n`;
            
            script += `We start with a major development: ${stories[0].title}. ${stories[0].context}\n\n`;
            if (stories[1]) script += `Turning to international affairs, ${stories[1].title}. ${stories[1].context}\n\n`;
            if (stories[2]) script += `In other significant news, ${stories[2].title}. ${stories[2].context}\n\n`;
            if (stories[3]) script += `Meanwhile, on the global stage, ${stories[3].title}. ${stories[3].context}\n\n`;
            if (stories[4]) script += `And finally, keeping an eye on, ${stories[4].title}. ${stories[4].context}\n\n`;
            
            script += `That's all for now. Thank you for listening, and stay informed.`;
            return script;
        }

        function prepareAndPlayAudio(script) {
            updateStatus("Generating neural audio chunks...", true);
            document.getElementById('stopBtn').style.display = 'block';
            
            const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
            const allChunks = [];

            // 1. Split into chunks and generate Google TTS URLs
            sentences.forEach((sentence, index) => {
                const chunks = chunkText(sentence, 180);
                chunks.forEach(chunk => {
                    allChunks.push({
                        sentenceIndex: index,
                        // Google Translate TTS: Free, high-quality, UK English
                        url: `https://translate.google.com/translate_tts?ie=UTF-8&tl=en-GB&client=tw-ob&q=${encodeURIComponent(chunk)}`
                    });
                });
            });

            // 2. Pre-create audio elements (Crucial for iOS Safari to allow sequential playback)
            audioElements = allChunks.map(chunk => {
                const a = new Audio(chunk.url);
                a.preload = "auto";
                return a;
            });

            // 3. Start playback sequence
            isPlaying = true;
            currentChunkIndex = 0;
            playNextChunk(allChunks);
        }

        function playNextChunk(allChunks) {
            if (!isPlaying || currentChunkIndex >= audioElements.length) {
                finishBriefing();
                return;
            }

            // Update Karaoke Highlight
            const currentSentenceIdx = allChunks[currentChunkIndex].sentenceIndex;
            document.querySelectorAll('#transcript span').forEach(el => el.classList.remove('highlight'));
            const currentEl = document.getElementById(`sent-${currentSentenceIdx}`);
            if (currentEl) {
                currentEl.classList.add('highlight');
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            const audio = audioElements[currentChunkIndex];
            audio.onended = () => {
                currentChunkIndex++;
                playNextChunk(allChunks);
            };
            audio.onerror = () => {
                console.warn("Audio chunk failed, skipping...");
                currentChunkIndex++;
                playNextChunk(allChunks);
            };
            
            audio.play().catch(err => {
                console.error("Play blocked:", err);
                showError("Audio playback blocked by browser. Please tap Generate again.");
                finishBriefing();
            });
        }

        async function startBriefing() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            document.getElementById('transcript').style.display = 'none';
            document.getElementById('status').innerText = "";

            try {
                const stories = await fetchBriefingData();
                updateStatus("Writing radio script...");
                const script = buildRadioScript(stories);
                
                // Show transcript with sentence spans for highlighting
                const transcriptDiv = document.getElementById('transcript');
                transcriptDiv.style.display = 'block';
                const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
                transcriptDiv.innerHTML = sentences.map((s, i) => `<span id="sent-${i}">${s.trim()} </span>`).join('');
                
                prepareAndPlayAudio(script);
            } catch (error) {
                console.error("Briefing Error:", error);
                showError(`Failed to fetch news: ${error.message}`);
                btn.disabled = false;
            }
        }

        function stopBriefing() {
            isPlaying = false;
            audioElements.forEach(a => { a.pause(); a.currentTime = 0; });
            finishBriefing();
        }

        function finishBriefing() {
            isPlaying = false;
            updateStatus("Briefing complete.");
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
            document.querySelectorAll('#transcript span').forEach(el => el.classList.remove('highlight'));
        }

        function showError(msg) {
            const el = document.getElementById('error-box');
            el.innerText = msg;
            el.style.display = 'block';
            updateStatus("Ready to try again.");
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
        }

        function updateStatus(msg, isPlaying = false) {
            const el = document.getElementById('status');
            if (isPlaying) {
                el.innerHTML = `<span class="playing-indicator"></span>${msg}`;
            } else {
                el.innerText = msg;
            }
        }
        
        window.startBriefing = startBriefing;
        window.stopBriefing = stopBriefing;
    </script>
</body>
</html>
