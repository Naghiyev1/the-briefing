<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Briefing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; width: 100%; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { color: #94a3b8; font-size: 1rem; font-weight: 400; margin-bottom: 10px; }
        .voice-info { color: #64748b; font-size: 0.85rem; font-style: italic; }
        
        .controls { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6); }
        .btn-primary:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        
        .btn-stop {
            flex: 0.4;
            background: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
            display: none; /* Hidden by default */
        }
        .btn-stop:hover { background: #dc2626; transform: translateY(-2px); }

        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }
        #script-output {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #cbd5e1;
            display: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }
        .highlight {
            background: rgba(139, 92, 246, 0.25);
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Briefing</h1>
            <p class="subtitle">Clean, curated global news. 100% free. Listen anytime.</p>
            <p class="voice-info" id="voiceInfo">Detecting best available voice...</p>
        </div>
        
        <div class="controls">
            <button id="generateBtn" class="btn btn-primary" onclick="startBriefing()">Generate & Play</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopBriefing()">Stop</button>
        </div>
        
        <div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="status"></p>
        
        <div id="script-output"></div it>
    </div>

    <script>
        let synthesizer = window.speechSynthesis;
        let voices = [];
        let currentUtterance = null;

        function loadVoices() { 
            voices = synthesizer.getVoices(); 
            const bestVoice = getBestVoice();
            if (bestVoice) {
                document.getElementById('voiceInfo').innerText = `Using voice: ${bestVoice.name}`;
            }
        }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getBestVoice() {
            // Aggressively target high-quality, natural-sounding voices
            const preferred = ["Samantha", "Daniel", "Karen", "Natural", "Neural", "Google UK English Female", "Google US English"];
            for (let keyword of preferred) {
                const match = voices.find(v => v.name.includes(keyword) && v.lang.startsWith('en'));
                if (match) return match;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        // Rigorous text cleaner to ensure NO garbage reaches the speaker
        function cleanText(text) {
            if (!text) return "";
            return text
                .replace(/\[.*?\]\(.*?\)/g, '') // Remove markdown links [text](url)
                .replace(/https?:\/\/\S+/g, '') // Remove any stray URLs
                .replace(/Published Time:.*?Z/gi, '') // Remove timestamps
                .replace(/Skip to content/gi, '')
                .replace(/<[^>]*>/g, '') // Remove any remaining HTML tags
                .replace(/\s+/g, ' ') // Normalize multiple spaces to single space
                .trim();
        }

        // 1. FETCH NEWS
        async function fetchBriefingData() {
            updateStatus("Fetching top global stories...");
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-fill').style.width = '50%';

            const RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
            
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Failed to fetch news feed");
            
            const data = await response.json();
            if (data.status !== 'ok') throw new Error("News service returned an error");
            
            const items = data.items.slice(0, 4);
            const stories = [];

            for (let item of items) {
                const title = item.title || "Untitled";
                // Clean the description rigorously
                let context = cleanText(item.description);
                
                // If the cleaned context is too short, use a generic fallback so it doesn't sound broken
                if (context.length < 20) {
                    context = "Details are still emerging on this developing story.";
                }
                stories.push({ title, context });
            }
            
            document.getElementById('progress-fill').style.width = '100%';
            setTimeout(() => { document.getElementById('progress-bar').style.display = 'none'; }, 500);
            return stories;
        }

        // 2. BUILD CONVERSATIONAL SCRIPT
        function buildConversationalScript(stories) {
            const today = new Intl.DateTimeFormat('en-GB', { 
                weekday: 'long', day: 'numeric', month: 'long' 
            }).format(new Date());

            let script = `Here is your briefing for ${today}. \n\n`;
            
            script += `Our top story: ${stories[0].title}. ${stories[0].context} \n\n`;
            
            if (stories[1]) script += `In other news, ${stories[1].title}. ${stories[1].context} \n\n`;
            if (stories[2]) script += `Meanwhile, ${stories[2].title}. ${stories[2].context} \n\n`;
            if (stories[3]) script += `And finally, ${stories[3].title}. ${stories[3].context} \n\n`;
            
            script += `That is your briefing. Stay informed.`;
            return script;
        }

        // 3. TEXT-TO-SPEECH WITH CONTROLS
        function speakScript(script) {
            updateStatus("Playing audio briefing...", true);
            document.getElementById('stopBtn').style.display = 'block'; // Show stop button
            synthesizer.cancel();

            const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
            const outputDiv = document.getElementById('script-output');
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = sentences.map((s, i) => `<span id="sent-${i}">${s.trim()} </span>`).join(' ');

            let current = 0;

            function speakNext() {
                if (current >= sentences.length) {
                    finishBriefing();
                    return;
                }

                document.querySelectorAll('#script-output span').forEach(el => el.classList.remove('highlight'));
                const currentEl = document.getElementById(`sent-${current}`);
                if (currentEl) {
                    currentEl.classList.add('highlight');
                    currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                currentUtterance = new SpeechSynthesisUtterance(sentences[current]);
                currentUtterance.voice = getBestVoice();
                currentUtterance.rate = 0.9; // Slower, more natural pacing
                currentUtterance.pitch = 1.0;

                currentUtterance.onend = () => { current++; speakNext(); };
                currentUtterance.onerror = () => { current++; speakNext(); };

                synthesizer.speak(currentUtterance);
            }

            speakNext();
        }

        // 4. CONTROLLERS
        window.startBriefing = async function() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            document.getElementById('script-output').style.display = 'none';
            document.getElementById('status').innerText = "";

            try {
                const stories = await fetchBriefingData();
                updateStatus("Preparing script...");
                const script = buildConversationalScript(stories);
                speakScript(script);
            } catch (error) {
                console.error("Briefing Error:", error);
                updateStatus(`Error: ${error.message}. Please try again.`);
                btn.disabled = false;
            }
        };

        window.stopBriefing = function() {
            synthesizer.cancel(); // Immediately stop speaking
            finishBriefing();
        };

        function finishBriefing() {
            updateStatus("Briefing complete.");
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none'; // Hide stop button
            document.querySelectorAll('#script-output span').forEach(el => el.classList.remove('highlight'));
        }

        function updateStatus(msg, isPlaying = false) {
            const el = document.getElementById('status');
            if (isPlaying) {
                el.innerHTML = `<span class="playing-indicator"></span>${msg}`;
            } else {
                el.innerText = msg;
            }
        }
    </script>
</body>
</html>
