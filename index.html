<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Briefing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; width: 100%; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { color: #94a3b8; font-size: 1rem; font-weight: 400; }
        .btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
            margin-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }
        #script-output {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #cbd5e1;
            display: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }
        .highlight {
            background: rgba(139, 92, 246, 0.25);
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .error-msg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Briefing</h1>
            <p class="subtitle">Deep context. Ultra-reliable. 100% free. Listen anytime.</p>
        </div>
        
        <button id="generateBtn" class="btn" onclick="startBriefing()">Generate & Play Briefing</button>
        
        <div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="status"></p>
        <div id="error-box" class="error-msg"></div>
        
        <div id="script-output"></div>
    </div>

    <script>
        let synthesizer = window.speechSynthesis;
        let voices = [];

        function loadVoices() { voices = synthesizer.getVoices(); }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getBestVoice() {
            const preferred = ["Natural", "Neural", "Google", "Microsoft", "Samantha", "Daniel", "Aria", "Karen"];
            for (let keyword of preferred) {
                const match = voices.find(v => v.name.includes(keyword) && v.lang.startsWith('en'));
                if (match) return match;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        // Helper: Fetch with a strict timeout to prevent mobile hangs
        async function fetchWithTimeout(url, ms = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), ms);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // 1. FETCH NEWS & DEEP CONTEXT (Ultra-Resilient)
        async function fetchBriefingData() {
            updateStatus("Fetching top global stories...");
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-fill').style.width = '20%';

            // Using rss2json: highly reliable, CORS-friendly, no API key needed for basic use
            const RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
            
            const response = await fetchWithTimeout(apiUrl, 8000);
            if (!response.ok) throw new Error("Failed to fetch RSS feed");
            
            const data = await response.json();
            if (data.status !== 'ok') throw new Error("RSS service returned an error");
            
            const items = data.items.slice(0, 4);
            const stories = [];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const title = item.title || "Untitled";
                const link = item.link || "";
                // Clean HTML tags from the default description
                let context = item.description ? item.description.replace(/<[^>]*>/g, '').trim() : "";
                
                // Attempt to get deeper context from the actual article (with a strict 4-second timeout)
                if (link && i < 3 && context.length < 150) { 
                    try {
                        updateStatus(`Gathering deeper context for: ${title.substring(0, 30)}...`);
                        document.getElementById('progress-fill').style.width = `${20 + (i * 20)}%`;
                        
                        const jinaRes = await fetchWithTimeout(`https://r.jina.ai/${link}`, 4000);
                        const fullText = await jinaRes.text();
                        
                        // Extract meaningful sentences
                        const sentences = fullText.match(/[^\.!\?]+[\.!\?]+/g) || [];
                        const meaningful = sentences.filter(s => 
                            s.length > 50 && 
                            !s.toLowerCase().includes("copyright") && 
                            !s.toLowerCase().includes("subscribe") &&
                            !s.toLowerCase().includes("click here")
                        ).slice(1, 4); 
                        
                        if (meaningful.length >= 2) {
                            context = meaningful.join(" ");
                        }
                    } catch (e) {
                        // Graceful fallback: if Jina fails or times out, we just use the RSS description
                        console.log("Deep fetch skipped/failed, using RSS description");
                    }
                }
                stories.push({ title, context });
            }
            
            document.getElementById('progress-fill').style.width = '100%';
            setTimeout(() => { document.getElementById('progress-bar').style.display = 'none'; }, 500);
            return stories;
        }

        // 2. BUILD CONVERSATIONAL SCRIPT
        function buildConversationalScript(stories) {
            const today = new Intl.DateTimeFormat('en-GB', { 
                weekday: 'long', day: 'numeric', month: 'long' 
            }).format(new Date());

            let script = `Here is your briefing for ${today}. \n\n`;
            
            script += `Our top story: ${stories[0].title}. ${stories[0].context} \n\n`;
            
            if (stories[1]) {
                script += `In other news, ${stories[1].title}. ${stories[1].context} \n\n`;
            }
            
            if (stories[2]) {
                script += `Meanwhile, ${stories[2].title}. ${stories[2].context} \n\n`;
            }
            
            if (stories[3]) {
                script += `And finally, ${stories[3].title}. ${stories[3].context} \n\n`;
            }
            
            script += `That is your briefing. Stay informed.`;
            return script;
        }

        // 3. TEXT-TO-SPEECH WITH KARAOKE HIGHLIGHTING
        function speakScript(script) {
            updateStatus("Playing audio briefing...", true);
            document.getElementById('error-box').style.display = 'none';
            synthesizer.cancel();

            const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
            const outputDiv = document.getElementById('script-output');
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = sentences.map((s, i) => `<span id="sent-${i}">${s.trim()} </span>`).join(' ');

            let current = 0;

            function speakNext() {
                if (current >= sentences.length) {
                    updateStatus("Briefing complete.");
                    document.getElementById('generateBtn').disabled = false;
                    return;
                }

                document.querySelectorAll('#script-output span').forEach(el => el.classList.remove('highlight'));
                const currentEl = document.getElementById(`sent-${current}`);
                if (currentEl) {
                    currentEl.classList.add('highlight');
                    currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                const utterance = new SpeechSynthesisUtterance(sentences[current]);
                utterance.voice = getBestVoice();
                utterance.rate = 0.95; 
                utterance.pitch = 1.0;

                utterance.onend = () => { current++; speakNext(); };
                utterance.onerror = () => { current++; speakNext(); };

                synthesizer.speak(utterance);
            }

            speakNext();
        }

        // 4. MAIN CONTROLLER
        async function startBriefing() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            document.getElementById('script-output').style.display = 'none';
            document.getElementById('error-box').style.display = 'none';

            try {
                const stories = await fetchBriefingData();
                updateStatus("Weaving conversational script...");
                const script = buildConversationalScript(stories);
                speakScript(script);
            } catch (error) {
                console.error("Briefing Error:", error);
                const errorBox = document.getElementById('error-box');
                errorBox.innerText = `Failed to generate briefing. Details: ${error.message}. Please check your internet connection and try again.`;
                errorBox.style.display = 'block';
                updateStatus("Ready to try again.");
                btn.disabled = false;
            }
        }

        function updateStatus(msg, isPlaying = false) {
            const el = document.getElementById('status');
            if (isPlaying) {
                el.innerHTML = `<span class="playing-indicator"></span>${msg}`;
            } else {
                el.innerText = msg;
            }
        }
        
        window.startBriefing = startBriefing;
    </script>
</body>
</html>
