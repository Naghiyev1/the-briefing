<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Briefing</title>
    <style>
        /* --- PREMIUM UI STYLING --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 400;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
            margin-bottom: 20px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Status & Progress */
        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Transcript Card (Glassmorphism) */
        #script-output {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #cbd5e1;
            display: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        /* Karaoke Highlight */
        .highlight {
            background: rgba(139, 92, 246, 0.25);
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Briefing</h1>
            <p class="subtitle">Contextual global news. 100% local AI. Listen anytime.</p>
        </div>
        
        <button id="generateBtn" class="btn" onclick="startBriefing()">Generate & Play Briefing</button>
        
        <div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="status"></p>
        
        <div id="script-output"></div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        let synthesizer = window.speechSynthesis;
        let voices = [];
        let aiGenerator = null;

        // 1. LOAD VOICES
        function loadVoices() { voices = synthesizer.getVoices(); }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getBestVoice() {
            const preferred = ["Natural", "Neural", "Google", "Microsoft", "Samantha", "Daniel", "Aria"];
            for (let keyword of preferred) {
                const match = voices.find(v => v.name.includes(keyword) && v.lang.startsWith('en'));
                if (match) return match;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        // 2. FETCH NEWS (BBC World News)
        async function fetchNews() {
            updateStatus("Fetching today's top global stories...");
            const RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
            const CORS_PROXY = "https://api.allorigins.win/raw?url=";
            
            const response = await fetch(CORS_PROXY + encodeURIComponent(RSS_URL));
            const str = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(str, "text/xml");
            
            const items = Array.from(xml.querySelectorAll("item")).slice(0, 5);
            return items.map(item => {
                const title = item.querySelector("title")?.textContent || "Untitled";
                const desc = item.querySelector("description")?.textContent?.replace(/<[^>]*>/g, '').trim() || "";
                return `• ${title}: ${desc}`;
            }).join("\n\n");
        }

        // 3. INITIALIZE LOCAL AI MODEL
        async function loadAI() {
            updateStatus("Loading local AI model (downloads ~100MB once, then caches forever)...");
            document.getElementById('progress-bar').style.display = 'block';
            
            aiGenerator = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-248M', {
                progress_callback: (data) => {
                    if (data.status === 'progress') {
                        const pct = Math.round(data.progress || 0);
                        document.getElementById('progress-fill').style.width = pct + '%';
                        updateStatus(`Downloading AI model: ${pct}%`);
                    }
                }
            });
            
            document.getElementById('progress-bar').style.display = 'none';
            updateStatus("AI loaded. Synthesizing context...");
        }

        // 4. GENERATE CONVERSATIONAL BRIEFING
        async function generateScript(newsText) {
            const today = new Intl.DateTimeFormat('en-GB', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            }).format(new Date());

            const prompt = `You are a professional, engaging news anchor. Today's date is ${today}. 
            Synthesize the following top global news items into a cohesive, conversational audio briefing. 
            Provide clear context for why each story matters. Use natural transitions. 
            Keep the total length around 200-250 words so it takes about 90 seconds to read. 
            Do not use bullet points. Write in plain paragraphs. 
            IMPORTANT: Do not say "Good morning" or "Good evening" unless it is contextually appropriate for the time of day in Europe. Just start directly with the news.
            
            NEWS ITEMS:
            ${newsText}`;
            
            const output = await aiGenerator(prompt, {
                max_new_tokens: 300,
                temperature: 0.7,
                repetition_penalty: 1.2
            });
            
            return output[0].generated_text;
        }

        // 5. TEXT-TO-SPEECH WITH KARAOKE HIGHLIGHTING
        function speakScript(script) {
            updateStatus("Playing audio briefing...", true); // true = show pulsing dot
            synthesizer.cancel();

            const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
            const outputDiv = document.getElementById('script-output');
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = sentences.map((s, i) => `<span id="sent-${i}">${s.trim()} </span>`).join(' ');

            let current = 0;

            function speakNext() {
                if (current >= sentences.length) {
                    updateStatus("Briefing complete.");
                    document.getElementById('generateBtn').disabled = false;
                    return;
                }

                document.querySelectorAll('#script-output span').forEach(el => el.classList.remove('highlight'));
                const currentEl = document.getElementById(`sent-${current}`);
                if (currentEl) {
                    currentEl.classList.add('highlight');
                    currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                const utterance = new SpeechSynthesisUtterance(sentences[current]);
                utterance.voice = getBestVoice();
                utterance.rate = 0.95; 
                utterance.pitch = 1.0;

                utterance.onend = () => { current++; speakNext(); };
                utterance.onerror = () => { current++; speakNext(); };

                synthesizer.speak(utterance);
            }

            speakNext();
        }

        // 6. MAIN CONTROLLER
        window.startBriefing = async function() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            document.getElementById('script-output').style.display = 'none';

            try {
                if (!aiGenerator) {
                    await loadAI();
                }
                
                const newsText = await fetchNews();
                const script = await generateScript(newsText);
                
                speakScript(script);
            } catch (error) {
                console.error(error);
                updateStatus("Error generating briefing. Check console or try again.");
                btn.disabled = false;
            }
        };

        function updateStatus(msg, isPlaying = false) {
            const el = document.getElementById('status');
            if (isPlaying) {
                el.innerHTML = `<span class="playing-indicator"></span>${msg}`;
            } else {
                el.innerText = msg;
            }
        }
    </script>
</body>
</html>
