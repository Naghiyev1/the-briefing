<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Briefing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { color: #94a3b8; font-size: 1rem; font-weight: 400; margin-bottom: 10px; }
        .voice-badge { 
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        .controls { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6); }
        .btn-primary:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        
        .btn-stop {
            flex: 0.4;
            background: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
            display: none;
        }
        .btn-stop:hover { background: #dc2626; transform: translateY(-2px); }

        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }
        #transcript {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #cbd5e1;
            display: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Briefing</h1>
            <p class="subtitle">Curated global news, delivered like a radio broadcast.</p>
            <span class="voice-badge">🎙️ Neural Voice: Brian (UK)</span>
        </div>
        
        <div class="controls">
            <button id="generateBtn" class="btn btn-primary" onclick="startBriefing()">Generate & Play</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopBriefing()">Stop</button>
        </div>
        
        <div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="status"></p>
        
        <div id="transcript"></div>
    </div>

    <script>
        let audioPlayer = null;

        // Rigorous text cleaner to ensure NO garbage reaches the speaker
        function cleanText(text) {
            if (!text) return "";
            return text
                .replace(/\[.*?\]\(.*?\)/g, '') // Remove markdown links
                .replace(/https?:\/\/\S+/g, '') // Remove URLs
                .replace(/Published Time:.*?Z/gi, '') // Remove timestamps
                .replace(/Skip to content/gi, '')
                .replace(/<[^>]*>/g, '') // Remove HTML tags
                .replace(/\s+/g, ' ') // Normalize spaces
                .trim();
        }

        // 1. FETCH NEWS
        async function fetchBriefingData() {
            updateStatus("Fetching top global stories...");
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-fill').style.width = '50%';

            const RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
            
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Failed to fetch news feed");
            
            const data = await response.json();
            if (data.status !== 'ok') throw new Error("News service returned an error");
            
            // Fetch top 5 stories for a richer briefing
            const items = data.items.slice(0, 5);
            const stories = [];

            for (let item of items) {
                const title = item.title || "Untitled";
                // Use 'content' if available for more depth, otherwise fall back to 'description'
                let rawContext = item.content || item.description || "";
                let context = cleanText(rawContext);
                
                // Ensure we have a meaningful sentence
                if (context.length < 30) {
                    context = "Details are still emerging on this developing story.";
                }
                stories.push({ title, context });
            }
            
            document.getElementById('progress-fill').style.width = '100%';
            setTimeout(() => { document.getElementById('progress-bar').style.display = 'none'; }, 500);
            return stories;
        }

        // 2. BUILD RADIO PRESENTER SCRIPT
        function buildRadioScript(stories) {
            const today = new Intl.DateTimeFormat('en-GB', { 
                weekday: 'long', day: 'numeric', month: 'long' 
            }).format(new Date());

            let script = `Hello, and welcome to your briefing for ${today}. `;
            script += "Here are the top stories you need to know right now.\n\n";
            
            script += `We begin with our top story: ${stories[0].title}. ${stories[0].context}\n\n`;
            
            if (stories[1]) {
                script += `Turning to our next development: ${stories[1].title}. ${stories[1].context}\n\n`;
            }
            if (stories[2]) {
                script += `In other global news, ${stories[2].title}. ${stories[2].context}\n\n`;
            }
            if (stories[3]) {
                script += `Meanwhile, ${stories[3].title}. ${stories[3].context}\n\n`;
            }
            if (stories[4]) {
                script += `And shifting focus slightly, ${stories[4].title}. ${stories[4].context}\n\n`;
            }
            
            script += `That is your briefing for today. Stay informed, and have a wonderful day.`;
            return script;
        }

        // 3. PLAY AUDIO VIA STREAMELEMENTS (Neural Voice)
        function playAudio(script) {
            updateStatus("Generating neural audio...", true);
            document.getElementById('stopBtn').style.display = 'block';
            
            // Stop any existing audio
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }

            // StreamElements API: Free, no key, uses high-quality Amazon Polly voices
            const encodedText = encodeURIComponent(script);
            const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodedText}`;
            
            audioPlayer = new Audio(audioUrl);
            
            audioPlayer.onplay = () => {
                updateStatus("Playing briefing...", true);
            };
            
            audioPlayer.onended = () => {
                finishBriefing();
            };
            
            audioPlayer.onerror = () => {
                updateStatus("Audio generation failed. Please try again.");
                finishBriefing();
            };

            audioPlayer.play().catch(err => {
                console.error("Audio play failed:", err);
                updateStatus("Tap 'Generate & Play' again to start audio.");
                finishBriefing();
            });
        }

        // 4. CONTROLLERS
        window.startBriefing = async function() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            document.getElementById('transcript').style.display = 'none';
            document.getElementById('status').innerText = "";

            try {
                const stories = await fetchBriefingData();
                updateStatus("Writing radio script...");
                const script = buildRadioScript(stories);
                
                // Show transcript
                const transcriptDiv = document.getElementById('transcript');
                transcriptDiv.style.display = 'block';
                transcriptDiv.innerText = script;
                
                // Play audio
                playAudio(script);
            } catch (error) {
                console.error("Briefing Error:", error);
                updateStatus(`Error: ${error.message}. Please try again.`);
                btn.disabled = false;
            }
        };

        window.stopBriefing = function() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                audioPlayer = null;
            }
            finishBriefing();
        };

        function finishBriefing() {
            updateStatus("Briefing complete.");
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
        }

        function updateStatus(msg, isPlaying = false) {
            const el = document.getElementById('status');
            if (isPlaying) {
                el.innerHTML = `<span class="playing-indicator"></span>${msg}`;
            } else {
                el.innerText = msg;
            }
        }
    </script>
</body>
</html>
